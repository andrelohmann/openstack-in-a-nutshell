---

- name: Prerequisites Ceph
  hosts: all
  gather_facts: true
  become: true
  become_method: ansible.builtin.sudo

  pre_tasks:

    - name: Load ansible vars, if existent
      ansible.builtin.include_vars:
        file: ansible_vars.yml

    - name: Set the hostname
      ansible.builtin.hostname:
        name: "{{ hostname }}"

    # - name: Update hosts file
    #   ansible.builtin.lineinfile:
    #     path: /etc/hosts
    #     regexp: '^127.0.0.1'
    #     line: "127.0.0.1 localhost"

    - name: Install dependencies packages
      ansible.builtin.apt:
        name: "{{ packages }}"
        state: present
        dpkg_options: 'force-confnew,force-confdef'
        autoclean: true
        autoremove: true
        update_cache: true
        cache_valid_time: 3600
      vars:
        packages:
          - curl
          - jq
          - acl

- name: Install ceph monitors
  hosts: ceph_mons
  gather_facts: true
  become: true
  become_method: ansible.builtin.sudo

  pre_tasks:

    - name: Load ansible vars, if existent
      ansible.builtin.include_vars:
        file: ansible_vars.yml

  roles:
    - ceph_mon

...
