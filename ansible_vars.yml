---
# This file contains the variables used in the Ansible playbooks for deploying OpenStack
# The variables are used in the playbooks and roles
RUN_TESTS: true
# Database password of the root user
ROOT_DBPASS: S3cr3tDB
# https://docs.openstack.org/install-guide/environment-security.html
# Password of user admin
ADMIN_PASS: qwertz
# Password of user demo
DEMO_PASS: qwerty
# Password of RabbitMQ user openstack
RABBIT_PASS: S3cre3tRabbit
# Database password of Identity service
KEYSTONE_DBPASS: K3yst0neDB
# Database password for Image service
GLANCE_DBPASS: Glanc3DB
# Password of Image service user glance
GLANCE_PASS: Glanc3
# Database password for Placement service
PLACEMENT_DBPASS: Plac3DB
# Password of the Placement service user placement
PLACEMENT_PASS: Plac3
# Database password for Compute service
NOVA_DBPASS: N0vaDB
# Password of Compute service user nova
NOVA_PASS: N0va
# Database password for the Networking service
NEUTRON_DBPASS: N3utr0nDB
# Password of Networking service user neutron
NEUTRON_PASS: N3utr0n
# Database password for the Block Storage service
CINDER_DBPASS: C1nd3rDB
# Password of Block Storage service user cinder
CINDER_PASS: C1nd3r

# IPs of the management Network
MGT_IP_CONTROLLER: 10.0.10.10
MGT_IP_COMPUTE1: 10.0.10.11
MGT_IP_COMPUTE2: 10.0.10.12

# Chrony - NTP Server
NTP_SERVER: pool.ntp.org

# OpenStack services networks
OS_MANAGEMENT_NETWORK: 10.0.10.0/24  # Management network for OpenStack
CEPH_PUBLIC_NETWORK: 10.0.40.0/24    # Mon, Mgr, RGW, Clients (Cinder, Glance, Nova)
CEPH_CLUSTER_NETWORK: 10.0.50.0/24   # OSD sync
OS_SDN_NETWORK: 10.0.30.0/24         # SDN Backbone network / physical network layer for virtual networks

# Secret for the metadata proxy
METADATA_SECRET: M3taDataS3cr3t

# Ceph Configurations
# Use these Metrics for the Lab Cluster Setup
ceph_osd_pool_default_size: 2
ceph_osd_pool_default_min_size: 1
ceph_fsid: 7272bf23-0a44-42e6-b591-5569713531fa
ceph_public_network: "{{ CEPH_PUBLIC_NETWORK }}"
ceph_cluster_network: "{{ CEPH_CLUSTER_NETWORK }}"

...
