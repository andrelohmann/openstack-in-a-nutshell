---
- hosts: all
  gather_facts: true
  become: true
  become_method: sudo

  pre_tasks:

  - name: Check for file ansible_vars.yml
    ansible.builtin.stat:
      path: ansible_vars.yml
    register: stat_ansible_vars

  - name: load ansible vars, if existent
    ansible.builtin.include_vars:
      file: ansible_vars.yml
    when: stat_ansible_vars.stat.exists

  - name: Set the hostname
    ansible.builtin.hostname:
      name: controller

  - name: Update hosts file
    ansible.builtin.lineinfile:
      path: /etc/hosts
      regexp: '^127.0.0.1'
      line: 127.0.0.1 localhost controller

  - name: Install dependencies packages
    ansible.builtin.apt:
      name: "{{ packages }}"
      state: present
      dpkg_options: 'force-confnew,force-confdef'
      autoclean: true
      autoremove: true
      update_cache: true
      cache_valid_time: 3600
    vars:
      packages:
      - curl
      - jq

  - name: Install cloud-archive:caracal
    command: add-apt-repository cloud-archive:caracal -y
  # - name: Install cloud-archive:bobcat
  #   command: add-apt-repository cloud-archive:bobcat -y
  # - name: Install cloud-archive:antelope
  #   command: add-apt-repository cloud-archive:antelope -y

  roles:
  - 00_controller_00_dependencies
  - 00_controller_01_keystone
  - 00_controller_02_glance
  - 00_controller_03_placement
  - 00_controller_04_neutron
  - 00_controller_05_nova
  - 00_controller_06_cinder
  - 00_controller_07_horizon

...
