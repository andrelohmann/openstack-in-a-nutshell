---
# Tasks to configure a Ceph monitor node (runs on every node in ceph_mons group)

- name: Ensure Ceph user and group exist
  ansible.builtin.group:
    name: "{{ ceph_group }}"
    state: present
- name: Ensure Ceph user exists
  ansible.builtin.user:
    name: "{{ ceph_user }}"
    group: "{{ ceph_group }}"
    system: true
    shell: /sbin/nologin
    state: present

- name: Create Monitor data directory
  ansible.builtin.file:
    path: "{{ mon_data_dir }}"
    state: directory
    owner: "{{ ceph_user }}"
    group: "{{ ceph_group }}"
    mode: '0750'

- name: Check if monitor data directory is initialized (mkfs run)
  ansible.builtin.stat:
    path: "{{ mon_initialized_check_file }}" # checks {{ mon_data_dir }}/keyring
  register: mon_already_initialized

# --- Handle Initial Bootstrap (only for the very first node) ---
- name: Perform mkfs for the first monitor node
  # This task runs ONLY if this is the first mon node AND the check file doesn't exist
  ansible.builtin.command: >
    ceph-mon --mkfs -i {{ inventory_hostname }}
    --monmap {{ ceph_bootstrap_monmap_file }}
    --keyring {{ ceph_bootstrap_mon_keyring_file }}
  args:
    creates: "{{ mon_initialized_check_file }}" # Strict idempotency via the check file
  become: true
  become_user: "{{ ceph_user }}"
  when:
    - inventory_hostname == groups['ceph_mons'][0] # Only run on the first node
    - not mon_already_initialized.stat.exists # Only if mkfs hasn't run

- name: Ensure correct ownership of first monitor's data directory after mkfs
  # mkfs is run as ceph user via become_user, but ensure recurive ownership just in case
  ansible.builtin.file:
    path: "{{ mon_data_dir }}"
    owner: "{{ ceph_user }}"
    group: "{{ ceph_group }}"
    recurse: yes
  when:
    - inventory_hostname == groups['ceph_mons'][0]
    - not mon_already_initialized.stat.exists

- name: Create systemd 'done' file for first monitor
  ansible.builtin.file:
    path: "{{ mon_data_dir }}/done"
    state: touch
    owner: "{{ ceph_user }}"
    group: "{{ ceph_group }}"
    mode: '0644'
  when:
    - inventory_hostname == groups['ceph_mons'][0]
    - not mon_already_initialized.stat.exists

# --- Handle adding a monitor to an EXISTING quorum ---
# This task runs on subsequent nodes being added, or on the first node if rerunning
# It ensures the node has its specific monitor key
- name: Check if monitor's specific key exists in its data directory
  ansible.builtin.stat:
    path: "{{ mon_data_dir }}/keyring" # Same check file, but this time we expect it if cluster bootstrapped
  register: mon_keyring_exists # Re-registering for clarity

- name: Define path for temporary MON key on admin node
  ansible.builtin.set_fact:
    temp_mon_key_path: "/tmp/{{ ceph_cluster_name }}.mon.{{ inventory_hostname }}.keyring"
  when: not mon_keyring_exists.stat.exists # Only need temp path if key is missing

- name: Generate authentication key for this monitor (run on admin_node, delegated)
  # Use get-or-create; requires admin_node to have admin key and reach cluster
  ansible.builtin.command: >
    ceph --cluster {{ ceph_cluster_name }}
    auth get-or-create mon.{{ inventory_hostname }}
    mon 'allow profile bootstrap-mon'
    -o {{ temp_mon_key_path }}
  args:
    creates: "{{ temp_mon_key_path }}" # Idempotency check on the temp file
  delegate_to: "{{ admin_node }}"
  become: true # Or true if needed for admin key access
  when: not mon_keyring_exists.stat.exists # Only generate if target key is missing

- name: Fetch generated monitor key from admin_node to controller
  ansible.builtin.fetch:
    src: "{{ temp_mon_key_path }}"
    dest: "/tmp/fetched_mon_keys/" # Fetches to /tmp/fetched_mon_keys/<admin_node>/tmp/key_filename
    flat: yes # Flattens to /tmp/fetched_mon_keys/key_filename
  delegate_to: "{{ admin_node }}"
  when: not mon_keyring_exists.stat.exists

- name: Copy monitor key from controller to monitor data directory
  ansible.builtin.copy:
    src: "/tmp/fetched_mon_keys/{{ ceph_cluster_name }}.mon.{{ inventory_hostname }}.keyring"
    dest: "{{ mon_data_dir }}/keyring" # Final location for the monitor's key
    owner: "{{ ceph_user }}"
    group: "{{ ceph_group }}"
    mode: '0600'
  when: not mon_keyring_exists.stat.exists # Only copy if target key was missing

- name: Clean up temporary key on admin_node
  ansible.builtin.file:
    path: "{{ temp_mon_key_path }}"
    state: absent
  delegate_to: "{{ admin_node }}"
  when: not mon_keyring_exists.stat.exists # Clean up only if it was created

- name: Clean up fetched key on controller
  ansible.builtin.file:
    path: "/tmp/fetched_mon_keys/{{ ceph_cluster_name }}.mon.{{ inventory_hostname }}.keyring"
    state: absent
  delegate_to: localhost
  become: true
  when: not mon_keyring_exists.stat.exists

- name: Enable and start Ceph Monitor service
  ansible.builtin.systemd:
    name: "ceph-mon@{{ inventory_hostname }}.service"
    enabled: true
    state: started
    daemon_reload: true # Reload systemd if unit file might have changed implicitly
  # Notify handler if service state changes to ensure restarts on config change
  # This task ensures the service is running regardless of mkfs or adding to quorum state

...
