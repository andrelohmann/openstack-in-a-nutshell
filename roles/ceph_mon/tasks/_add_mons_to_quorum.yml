---
# Tasks to add monitors to the running cluster quorum using 'ceph mon add'
# Runs ONLY if cluster is already bootstrapped (checked in main.yml)
# These tasks are delegated to the bootstrap node where ceph commands are run

- name: Wait for initial monitors to form quorum (optional but recommended)
  ansible.builtin.pause:
    seconds: 15
  when: groups['ceph_mons'] | length > 1
  delegate_to: "{{ admin_node }}" # ADD THIS

- name: Fetch current monitor map from running cluster
  ansible.builtin.command: >
    ceph --cluster {{ ceph_cluster_name }}
    -f json mon dump
  delegate_to: "{{ admin_node }}" # Or admin_node
  become: true # Needs permissions to run ceph commands, likely root
  register: ceph_mon_dump_result
  changed_when: false # This command doesn't change state
  until:
    # Ensure the command itself returns success (rc=0)
    - ceph_mon_dump_result.rc == 0
    # Ensure stdout is not empty and can be parsed as JSON
    - ceph_mon_dump_result.stdout | length > 0
    - ceph_mon_dump_result.stdout | from_json is not none # Check if JSON parsing succeeded
    # After parsing, check if the top-level 'mons' key exists and is a list
    - (ceph_mon_dump_result.stdout | from_json).mons is defined # Check for mons key (top level)
    - (ceph_mon_dump_result.stdout | from_json).mons is sequence # Check if mons is a list/sequence
    # Finally, check if the bootstrap node's name is in the list of mons using the correct path
    - admin_node in (ceph_mon_dump_result.stdout | from_json | json_query('mons[*].name')) # <--- Corrected path here
  retries: 30
  delay: 10

- name: Extract list of monitors currently in the quorum
  ansible.builtin.set_fact:
    existing_mons: "{{ ceph_mon_dump_result.stdout | from_json | json_query('monmap.mons[*].name') }}"
  # No delegate_to needed for set_fact unless setting a host var on a different host

- name: Identify monitors to be added
  ansible.builtin.set_fact:
    mons_to_add: "{{ groups['ceph_mons'] | difference(existing_mons) }}"
  # No delegate_to needed for set_fact unless setting a host var on a different host

- name: Add monitors to the cluster quorum (tolerate EEXIST)
  # Loop over ALL desired monitors from inventory
  ansible.builtin.command: >
    ceph --cluster {{ ceph_cluster_name }}
    mon add {{ item }} {{ hostvars[item]['ceph_public_ip'] }}
  delegate_to: "{{ admin_node }}"
  become: true
  loop: "{{ groups['ceph_mons'] }}" # <-- Loop over all monitors in inventory
  register: add_mon_commands
  # --- Handle EEXIST as Success ---
  failed_when: add_mon_commands.rc not in [0, 17] # RC 0 is success, RC 17 is EEXIST
  changed_when: add_mon_commands.rc == 0 # Only report changed if RC 0 (successfully added)
  # --- End Handle EEXIST ---

- name: Report on add monitor attempts
  ansible.builtin.debug:
    msg: "Attempted to add monitor {{ item.item }}. RC: {{ item.rc }}, Output: {{ item.stdout | default('') }} {{ item.stderr | default('') }}"
  loop: "{{ add_mon_commands.results }}"

#- name: Report on added monitors
#  ansible.builtin.debug:
#    msg: "Added monitor {{ item.item }}. Output: {{ item.stdout }}"
#  loop: "{{ add_mon_commands.results }}"
#  when: item.changed

- name: Verify Ceph cluster status after potentially adding monitors
  ansible.builtin.command: ceph -s
  delegate_to: "{{ groups['ceph_mons'][0] }}" # ADD THIS
  register: ceph_status_after_add
  changed_when: false

- name: Print Ceph status
  ansible.builtin.debug:
    var: ceph_status_after_add.stdout_lines
  delegate_to: "{{ groups['ceph_mons'][0] }}" # ADD THIS (debug is usually run on controller, but here we want output from delegated host)

...
