---

- name: Create the neutron user
  ansible.builtin.expect:
    command: openstack user create --domain default --password-prompt neutron
    responses:
      'User Password': '{{ NEUTRON_PASS }}'
      'Repeat User Password': '{{ NEUTRON_PASS }}'
    timeout: 30
    creates: /opt/os-deployment-progress/neutron-user
  become: true
  become_user: admin-os
  become_flags: -i

- name: Touch /opt/os-deployment-progress/neutron-user for idempotency
  ansible.builtin.file:
    path: /opt/os-deployment-progress/neutron-user
    state: touch
    owner: root
    group: root
    mode: '0755'

- name: Add the admin role to the neutron user and service project
  ansible.builtin.shell: |
    openstack role add --project service --user neutron admin
  args:
    executable: /bin/bash
    creates: /opt/os-deployment-progress/neutron-admin
  become: true
  become_user: admin-os
  become_flags: -i

- name: Touch /opt/os-deployment-progress/neutron-admin for idempotency
  ansible.builtin.file:
    path: /opt/os-deployment-progress/neutron-admin
    state: touch
    owner: root
    group: root
    mode: '0755'

- name: Create the neutron service entity
  ansible.builtin.shell: |
    openstack service create --name neutron --description "OpenStack Networking" network
  args:
    executable: /bin/bash
    creates: /opt/os-deployment-progress/neutron-network
  become: true
  become_user: admin-os
  become_flags: -i

- name: Touch /opt/os-deployment-progress/neutron-network for idempotency
  ansible.builtin.file:
    path: /opt/os-deployment-progress/neutron-network
    state: touch
    owner: root
    group: root
    mode: '0755'

- name: Create the public neutron service API endpoint
  ansible.builtin.shell: |
    openstack endpoint create --region RegionOne network public http://controller:9696 --format json
  args:
    executable: /bin/bash
    creates: /opt/os-deployment-progress/neutron-endpoint-public
  become: true
  become_user: admin-os
  become_flags: -i

- name: Touch /opt/os-deployment-progress/neutron-endpoint-public for idempotency
  ansible.builtin.file:
    path: /opt/os-deployment-progress/neutron-endpoint-public
    state: touch
    owner: root
    group: root
    mode: '0755'

- name: Create the internal neutron service API endpoint
  ansible.builtin.shell: |
    openstack endpoint create --region RegionOne network internal http://controller:9696
  args:
    executable: /bin/bash
    creates: /opt/os-deployment-progress/neutron-endpoint-internal
  become: true
  become_user: admin-os
  become_flags: -i

- name: Touch /opt/os-deployment-progress/neutron-endpoint-internal for idempotency
  ansible.builtin.file:
    path: /opt/os-deployment-progress/neutron-endpoint-internal
    state: touch
    owner: root
    group: root
    mode: '0755'

- name: Create the admin neutron service API endpoint
  ansible.builtin.shell: |
    openstack endpoint create --region RegionOne network admin http://controller:9696
  args:
    executable: /bin/bash
    creates: /opt/os-deployment-progress/neutron-endpoint-admin
  become: true
  become_user: admin-os
  become_flags: -i

- name: Touch /opt/os-deployment-progress/neutron-endpoint-admin for idempotency
  ansible.builtin.file:
    path: /opt/os-deployment-progress/neutron-endpoint-admin
    state: touch
    owner: root
    group: root
    mode: '0755'

...
