- name: Configure Networking to notify Compute of network topology changes
  ansible.builtin.ini_file:
    path: /etc/neutron/neutron.conf
    section: "{{ item.section }}"
    option: "{{ item.option }}"
    value: "{{ item.value }}"
  with_items:
    - { section: "DEFAULT", option: "notify_nova_on_port_status_changes", value: "true" }
    - { section: "DEFAULT", option: "notify_nova_on_port_data_changes", value: "true" }
    - { section: "nova", option: "auth_url", value: "http://controller:5000/" }
    - { section: "nova", option: "auth_type", value: "password" }
    - { section: "nova", option: "project_domain_name", value: "Default" }
    - { section: "nova", option: "user_domain_name", value: "Default" }
    - { section: "nova", option: "region_name", value: "RegionOne" }
    - { section: "nova", option: "project_name", value: "service" }
    - { section: "nova", option: "username", value: "nova" }
    - { section: "nova", option: "password", value: "{{ NOVA_PASS }}" }

- name: Configure oslo concurrency
  ansible.builtin.ini_file:
    path: /etc/neutron/neutron.conf
    section: "{{ item.section }}"
    option: "{{ item.option }}"
    value: "{{ item.value }}"
  with_items:
    - { section: "oslo_concurrency", option: "lock_path", value: "/var/lib/neutron/tmp" }

- name: Configure the Modular Layer 2 (ML2) plug-in
  ansible.builtin.ini_file:
    path: /etc/neutron/neutron.conf
    section: "{{ item.section }}"
    option: "{{ item.option }}"
    value: "{{ item.value }}"
  with_items:
    - { section: "ml2", option: "type_drivers", value: "flat,vlan,vxlan" }
    - { section: "ml2", option: "tenant_network_types", value: "vxlan" }
    - { section: "ml2", option: "mechanism_drivers", value: "openvswitch,l2population" }
    - { section: "ml2", option: "extension_drivers", value: "port_security" }
    - { section: "ml2_type_flat", option: "flat_networks", value: "provider" }
    - { section: "ml2_type_vxlan", option: "vni_ranges", value: "1:1000" }

- name: Configure the Open vSwitch agent
  ansible.builtin.ini_file:
    path: /etc/neutron/plugins/ml2/openvswitch_agent.ini
    section: "{{ item.section }}"
    option: "{{ item.option }}"
    value: "{{ item.value }}"
  with_items:
    - { section: "ovs", option: "bridge_mappings", value: "provider:prvbr0" }
    - { section: "ovs", option: "local_ip", value: "{{ MGT_IP_CONTROLLER }}" }
    - { section: "agent", option: "tunnel_types", value: "vxlan" }
    - { section: "agent", option: "l2_population", value: "true" }
    - { section: "securitygroup", option: "enable_security_group", value: "true" }
    - { section: "securitygroup", option: "firewall_driver", value: "openvswitch" }

- name: Set sysctl net.bridge.bridge-nf-call-ip(6)tables
  ansible.posix.sysctl:
    name: "{{ item }}"
    value: '1'
    sysctl_set: true
    state: present
    reload: true
  with_items:
  - net.bridge.bridge-nf-call-iptables
  - net.bridge.bridge-nf-call-ip6tables

- name: Add br_netfilter kernel module
  community.general.modprobe:
    name: br_netfilter
    state: present
    persistent: present

- name: Configure the layer-3 agent
  ansible.builtin.ini_file:
    path: /etc/neutron/l3_agent.ini
    section: "{{ item.section }}"
    option: "{{ item.option }}"
    value: "{{ item.value }}"
  with_items:
    - { section: "DEFAULT", option: "interface_driver", value: "openvswitch" }

- name: Configure the DHCP agent
  ansible.builtin.ini_file:
    path: /etc/neutron/dhcp_agent.ini
    section: "{{ item.section }}"
    option: "{{ item.option }}"
    value: "{{ item.value }}"
  with_items:
    - { section: "DEFAULT", option: "interface_driver", value: "openvswitch" }
    - { section: "DEFAULT", option: "dhcp_driver", value: "neutron.agent.linux.dhcp.Dnsmasq" }
    - { section: "DEFAULT", option: "enable_isolated_metadata", value: "true" }

- name: Configure the metadata agent
  ansible.builtin.ini_file:
    path: /etc/neutron/metadata_agent.ini
    section: "{{ item.section }}"
    option: "{{ item.option }}"
    value: "{{ item.value }}"
  with_items:
    - { section: "DEFAULT", option: "nova_metadata_host", value: "controller" }
    - { section: "DEFAULT", option: "metadata_proxy_shared_secret", value: "{{ METADATA_SECRET }}" }

- name: Configure the Compute service to use the Networking service
  ansible.builtin.ini_file:
    path: /etc/nova/nova.conf
    section: "{{ item.section }}"
    option: "{{ item.option }}"
    value: "{{ item.value }}"
  with_items:
    - { section: "neutron", option: "auth_url", value: "http://controller:5000/" }
    - { section: "neutron", option: "auth_type", value: "password" }
    - { section: "neutron", option: "project_domain_name", value: "Default" }
    - { section: "neutron", option: "user_domain_name", value: "Default" }
    - { section: "neutron", option: "region_name", value: "RegionOne" }
    - { section: "neutron", option: "project_name", value: "service" }
    - { section: "neutron", option: "username", value: "neutron" }
    - { section: "neutron", option: "password", value: "{{ NEUTRON_PASS }}" }
    - { section: "neutron", option: "service_metadata_proxy", value: "true" }
    - { section: "neutron", option: "metadata_proxy_shared_secret", value: "{{ METADATA_SECRET }}" }

- name: Populate the neutron database
  ansible.builtin.shell: su -s /bin/sh -c "neutron-db-manage --config-file /etc/neutron/neutron.conf --config-file /etc/neutron/plugins/ml2/ml2_conf.ini upgrade head" neutron
  args:
    executable: /bin/bash
    creates: /var/lib/mysql/neutron/alembic_version.ibd

- name: Restart nova-api
  ansible.builtin.systemd:
    name: nova-api.service
    state: restarted
  changed_when: false

- name: Restart neutron-server
  ansible.builtin.systemd:
    name: neutron-server.service
    state: restarted
  changed_when: false

- name: Restart neutron-openvswitch-agent
  ansible.builtin.systemd:
    name: neutron-openvswitch-agent.service
    state: restarted
  changed_when: false

- name: Restart neutron-dhcp-agent
  ansible.builtin.systemd:
    name: neutron-dhcp-agent.service
    state: restarted
  changed_when: false

- name: Restart neutron-metadata-agent
  ansible.builtin.systemd:
    name: neutron-metadata-agent.service
    state: restarted
  changed_when: false

- name: Restart neutron-l3-agent
  ansible.builtin.systemd:
    name: neutron-l3-agent.service
    state: restarted
  changed_when: false

...
