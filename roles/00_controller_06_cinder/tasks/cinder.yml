- name: Configure management interface IP address of the controller node
  ansible.builtin.ini_file:
    path: /etc/cinder/cinder.conf
    section: "{{ item.section }}"
    option: "{{ item.option }}"
    value: "{{ item.value }}"
  with_items:
    - { section: "DEFAULT", option: "my_ip", value: "{{ MGT_IP_CONTROLLER }}" }

- name: Configure oslo concurrency
  ansible.builtin.ini_file:
    path: /etc/cinder/cinder.conf
    section: "{{ item.section }}"
    option: "{{ item.option }}"
    value: "{{ item.value }}"
  with_items:
    - { section: "oslo_concurrency", option: "lock_path", value: "/var/lib/cinder/tmp" }

- name: Populate the cinder database
  ansible.builtin.shell: su -s /bin/sh -c "cinder-manage db sync" cinder
  args:
    executable: /bin/bash
    creates: /var/lib/mysql/cinder/alembic_version.ibd

- name: Configure Compute to use Block Storage
  ansible.builtin.ini_file:
    path: /etc/nova/nova.conf
    section: "{{ item.section }}"
    option: "{{ item.option }}"
    value: "{{ item.value }}"
  with_items:
    - { section: "cinder", option: "os_region_name", value: "RegionOne" }

- name: Restart nova-api
  ansible.builtin.systemd:
    name: nova-api.service
    state: restarted
  changed_when: false

- name: Restart cinder-scheduler
  ansible.builtin.systemd:
    name: cinder-scheduler.service
    state: restarted
  changed_when: false

- name: Restart apache2
  ansible.builtin.systemd:
    name: apache2.service
    state: restarted
  changed_when: false

...
