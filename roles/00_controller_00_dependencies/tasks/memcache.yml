---

- name: Install dependencies packages
  ansible.builtin.apt:
    name: "{{ packages }}"
    state: present
    dpkg_options: 'force-confnew,force-confdef'
    autoclean: true
    autoremove: true
    update_cache: true
    cache_valid_time: 3600
  vars:
    packages:
    - memcached
    - python3-memcache

- name: Uncomment IPv6 listening interface
  ansible.builtin.lineinfile:
    path: /etc/memcached.conf
    regexp: '^-l ::1'
    line: '#-l ::1'

- name: Make memcached listen on all IPv4 interfaces
  ansible.builtin.lineinfile:
    path: /etc/memcached.conf
    regexp: '^-l '
    line: '-l 0.0.0.0'

- name: Restart memcached
  ansible.builtin.systemd:
    name: memcached.service
    state: restarted
  changed_when: false

...
