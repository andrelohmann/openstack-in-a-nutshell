---

- name: Define initial monitor facts
  ansible.builtin.set_fact:
    ceph_initial_mon_ip: "{{ hostvars[groups['ceph_mons'][0]]['ceph_public_ip'] }}"
    ceph_mon_data_dir: "/var/lib/ceph/mon/ceph-{{ inventory_hostname }}"
    ceph_mon_done_file: "/var/lib/ceph/mon/ceph-{{ inventory_hostname }}/done"
    # Path on Ansible controller to store fetched artifacts, unique per cluster via FSID
    controller_bootstrap_artifact_path: "/tmp/ceph_bootstrap_artifacts_{{ ceph_fsid }}"
  # This task should ideally run only when bootstrapping the very first monitor.
  # The facts are set for the current host, but some (like initial_mon_hostname) are cluster-wide.
  # If this file is included conditionally for the first mon, run_once: true might be appropriate here.

- name: Generate admin keyring ({{ ceph_admin_keyring_path }})
  ansible.builtin.command:
    cmd: "ceph auth get-or-create mgr.controller mon 'allow profile mgr' osd 'allow *' mds 'allow *'"
    creates: "{{ ceph_admin_keyring_path }}"

