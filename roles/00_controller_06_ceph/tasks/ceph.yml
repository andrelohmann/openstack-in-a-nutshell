---

- name: Install ceph packages
  ansible.builtin.apt:
    name: "{{ packages }}"
    state: present
    dpkg_options: 'force-confnew,force-confdef'
    autoclean: true
    autoremove: true
    update_cache: true
    cache_valid_time: 3600
  vars:
    packages:
    - ceph-common

## Alternate Approach to create keyrings
# ceph-authtool \
# --create-keyring /etc/ceph/ceph.client.admin.keyring \
# --gen-key -n client.admin \
