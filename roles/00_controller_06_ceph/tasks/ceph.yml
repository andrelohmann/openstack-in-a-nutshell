# --create-keyring /opt/ceph.mon.keyring \
# --gen-key -n mon. \
# --cap mon 'allow *'
#
# ceph-authtool \
# /opt/ceph.mon.keyring \
# --import-keyring /etc/ceph/ceph.client.admin.keyring
#
# monmaptool \
# --create --add controller 10.0.1.10 --add compute1 10.0.1.11 --add compute2 10.0.1.12 --fsid <your_generated_fsid> /opt/monmap

- name: sync TOKEN file locally
  ansible.builtin.fetch:
    src: /etc/ceph/ceph.client.admin.keyring
    dest: out/ceph.client.admin.keyring
    flat: yes

- name: Configure cinder connection
  ansible.builtin.ini_file:
    path: /etc/cinder/cinder.conf
    section: "{{ item.section }}"
    option: "{{ item.option }}"
    value: "{{ item.value }}"
  with_items:
  - { section: "database", option: "connection", value: "mysql+pymysql://cinder:{{ CINDER_DBPASS }}@controller/cinder" }

- name: Restart nova-api
  ansible.builtin.systemd:
    name: nova-api.service
    state: restarted
  changed_when: false

- name: Restart cinder-scheduler
  ansible.builtin.systemd:
    name: cinder-scheduler.service
    state: restarted
  changed_when: false

- name: Restart apache2
  ansible.builtin.systemd:
    name: apache2.service
    state: restarted
  changed_when: false

...
