- name: Configure service user tokens
  ansible.builtin.ini_file:
    path: /etc/nova/nova.conf
    section: "{{ item.section }}"
    option: "{{ item.option }}"
    value: "{{ item.value }}"
  with_items:
    - { section: "service_user", option: "send_service_user_token", value: "true" }
    - { section: "service_user", option: "auth_url", value: "http://controller/identity" }
    - { section: "service_user", option: "auth_strategy", value: "keystone" }
    - { section: "service_user", option: "auth_type", value: "password" }
    - { section: "service_user", option: "project_domain_name", value: "Default" }
    - { section: "service_user", option: "user_domain_name", value: "Default" }
    - { section: "service_user", option: "project_name", value: "service" }
    - { section: "service_user", option: "username", value: "nova" }
    - { section: "service_user", option: "password", value: "{{ NOVA_PASS }}" }

- name: Configure management interface IP address of the controller node
  ansible.builtin.ini_file:
    path: /etc/nova/nova.conf
    section: "{{ item.section }}"
    option: "{{ item.option }}"
    value: "{{ item.value }}"
  with_items:
    - { section: "DEFAULT", option: "my_ip", value: "{{ MGT_IP_CONTROLLER }}" }

- name: Configure vnc
  ansible.builtin.ini_file:
    path: /etc/nova/nova.conf
    section: "{{ item.section }}"
    option: "{{ item.option }}"
    value: "{{ item.value }}"
  with_items:
    - { section: "vnc", option: "enabled", value: "true" }
    - { section: "vnc", option: "server_listen", value: "$my_ip" }
    - { section: "vnc", option: "server_proxyclient_address", value: "$my_ip" }

- name: Configure glance
  ansible.builtin.ini_file:
    path: /etc/nova/nova.conf
    section: "{{ item.section }}"
    option: "{{ item.option }}"
    value: "{{ item.value }}"
  with_items:
    # API Servers is a deprecated option
    - { section: "glance", option: "api_servers", value: "http://controller:9292" }

- name: Configure oslo concurrency
  ansible.builtin.ini_file:
    path: /etc/nova/nova.conf
    section: "{{ item.section }}"
    option: "{{ item.option }}"
    value: "{{ item.value }}"
  with_items:
    - { section: "oslo_concurrency", option: "lock_path", value: "/var/lib/nova/tmp" }

- name: Configure placement
  ansible.builtin.ini_file:
    path: /etc/nova/nova.conf
    section: "{{ item.section }}"
    option: "{{ item.option }}"
    value: "{{ item.value }}"
  with_items:
    - { section: "placement", option: "region_name", value: "RegionOne" }
    - { section: "placement", option: "project_domain_name", value: "Default" }
    - { section: "placement", option: "user_domain_name", value: "Default" }
    - { section: "placement", option: "project_name", value: "service" }
    - { section: "placement", option: "auth_type", value: "password" }
    - { section: "placement", option: "auth_url", value: "http://controller:5000/v3" }
    - { section: "placement", option: "username", value: "placement" }
    - { section: "placement", option: "password", value: "{{ PLACEMENT_PASS }}" }

- name: Configure neutron
  ansible.builtin.ini_file:
    path: /etc/nova/nova.conf
    section: "{{ item.section }}"
    option: "{{ item.option }}"
    value: "{{ item.value }}"
  with_items:
    - { section: "neutron", option: "auth_url", value: "http://controller:5000/" }
    - { section: "neutron", option: "auth_type", value: "password" }
    - { section: "neutron", option: "project_domain_name", value: "Default" }
    - { section: "neutron", option: "user_domain_name", value: "Default" }
    - { section: "neutron", option: "region_name", value: "RegionOne" }
    - { section: "neutron", option: "project_name", value: "service" }
    - { section: "neutron", option: "username", value: "neutron" }
    - { section: "neutron", option: "password", value: "{{ NEUTRON_PASS }}" }
    - { section: "neutron", option: "service_metadata_proxy", value: "true" }
    - { section: "neutron", option: "metadata_proxy_shared_secret", value: "{{ METADATA_SECRET }}" }

- name: Configure automatic compute node discovery
  ansible.builtin.ini_file:
    path: /etc/nova/nova.conf
    section: "{{ item.section }}"
    option: "{{ item.option }}"
    value: "{{ item.value }}"
  with_items:
    - { section: "scheduler", option: "discover_hosts_in_cells_interval", value: "300" }

- name: Initialize the nova-api database
  ansible.builtin.shell: su -s /bin/sh -c "nova-manage api_db sync" nova
  args:
    executable: /bin/bash
    creates: /var/lib/mysql/nova_api/alembic_version.ibd

- name: Register the cell0 database
  ansible.builtin.shell: su -s /bin/sh -c "nova-manage cell_v2 map_cell0" nova
  args:
    executable: /bin/bash
    creates: /opt/os-deployment-progress/nova-cell-mappings

- name: Touch /opt/os-deployment-progress/nova-cell-mappings for idempotency
  ansible.builtin.file:
    path: /opt/os-deployment-progress/nova-cell-mappings
    state: touch
    owner: root
    group: root
    mode: '0755'

- name: Create the cell1 cell
  ansible.builtin.shell: su -s /bin/sh -c "nova-manage cell_v2 create_cell --name=cell1 --verbose" nova
  args:
    executable: /bin/bash
    creates: /opt/os-deployment-progress/nova-cell-create

- name: Touch /opt/os-deployment-progress/nova-cell-create for idempotency
  ansible.builtin.file:
    path: /opt/os-deployment-progress/nova-cell-create
    state: touch
    owner: root
    group: root
    mode: '0755'

- name: Populate the nova database
  ansible.builtin.shell: su -s /bin/sh -c "nova-manage db sync" nova
  args:
    executable: /bin/bash
    creates: /var/lib/mysql/nova/alembic_version.ibd

- name: Restart nova-api
  ansible.builtin.systemd:
    name: nova-api.service
    state: restarted
  changed_when: false

- name: Restart nova-scheduler
  ansible.builtin.systemd:
    name: nova-scheduler.service
    state: restarted
  changed_when: false

- name: Restart nova-conductor
  ansible.builtin.systemd:
    name: nova-conductor.service
    state: restarted
  changed_when: false

- name: Restart nova-novncproxy
  ansible.builtin.systemd:
    name: nova-novncproxy.service
    state: restarted
  changed_when: false

...
