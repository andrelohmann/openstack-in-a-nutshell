---

- name: Create the glance database
  community.mysql.mysql_db:
    name: glance
    state: present

- name: Create user glance and give all permissions to glance from localhost
  community.mysql.mysql_user:
    name: glance
    password: qwertz
    priv: 'glance.*:ALL'
    host: localhost
    state: present

- name: Create user glance and give all permissions to glance from %
  community.mysql.mysql_user:
    name: glance
    password: qwertz
    priv: 'glance.*:ALL'
    host: '%'
    state: present

...
